name: Fourth Power
description: >-
  Fourth Power is a grid-scale thermal energy storage company building a "thermal
  battery" that stores electricity as heat. Surplus wind and solar power is used to
  heat blocks of graphite to roughly 2,400 degrees Celsius; molten tin, circulated by
  an all-ceramic pump, moves that heat in and out of storage, and thermophotovoltaic
  (TPV) cells convert the stored heat back into electricity when the grid needs it.
  The company positions the system as a cheaper, longer-duration alternative to
  lithium-ion for firming a clean grid, and operates a megawatt-scale demonstration
  facility near Boston. Fourth Power raised a Series A led by DCVC in 2023. This is a
  company profile in the API Evangelist network; Fourth Power is a hardware and energy
  company and does not publish a public developer API.
